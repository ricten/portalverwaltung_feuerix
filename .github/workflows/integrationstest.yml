name: Integrationstest (echte Bereitstellung)

# Stellt eine echte Feuerix-Instanz ueber die Portalverwaltung bereit (kein Mock) - im Unterschied zu den
# Unit-Tests, die docker/HTTP mocken. Braucht dafuer echtes Docker, das auf GitHub-gehosteten Ubuntu-Runnern
# bereits vorinstalliert ist. Auch der Reverse Proxy ist echt: ein Caddy-Container, dessen Konfiguration die
# Portalverwaltung ueber die Admin-API pflegt. Keine Secrets noetig: alle Geheimnisse werden automatisch erzeugt.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  bereitstellung:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DJANGO_SETTINGS_MODULE: config.settings_sqlite
      FEUERIX_REPO_PFAD: ${{ github.workspace }}/feuerix
      INSTANZEN_VERZEICHNIS: ${{ github.workspace }}/instanzen
      WEB_PORT_BASIS: "8100"
      KUERZEL: ci-test
      DOMAIN: ci-test.example.test
      PAPERLESS_DOMAIN: ci-test-paperless.example.test
      PAPERLESS_PORT_BASIS: "10100"
      CADDY_ADMIN_URL: http://127.0.0.1:2019
      PROXY_NUR_HTTP: "1"   # Caddy im Test ohne Zertifikate (reines HTTP auf Port 80)

    steps:
      - name: Portalverwaltung auschecken
        uses: actions/checkout@v4
        with:
          path: portalverwaltung

      - name: Feuerix auschecken
        uses: actions/checkout@v4
        with:
          repository: ricten/Feuerix
          ref: main
          path: feuerix

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        working-directory: portalverwaltung
        run: pip install -r requirements.txt

      - name: Unit-Tests
        working-directory: portalverwaltung
        run: python manage.py test

      - name: Portalverwaltungs-Datenbank einrichten
        working-directory: portalverwaltung
        run: python manage.py migrate

      - name: Test-Mandant anlegen
        working-directory: portalverwaltung
        run: |
          python manage.py shell -c "
          from apps.mandanten.models import MandantInstanz
          MandantInstanz.objects.get_or_create(kuerzel='${{ env.KUERZEL }}', defaults={
              'verein_name': 'CI-Test e.V.', 'domain': '${{ env.DOMAIN }}', 'paperless_domain': '${{ env.PAPERLESS_DOMAIN }}', 'admin_email': 'ci@example.org'})
          "

      - name: Caddy (Reverse Proxy) starten
        run: |
          docker run -d --name caddy --network host caddy:2
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:2019/config/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:2019/config/ >/dev/null || { echo "FEHLER: Caddy-Admin-API nicht erreichbar"; exit 1; }
          echo "OK: Caddy laeuft."

      - name: Instanz bereitstellen (echtes docker compose up + Proxy-Eintrag)
        working-directory: portalverwaltung
        run: python manage.py mandant_bereitstellen "${{ env.KUERZEL }}"

      - name: Login-Seite direkt pruefen
        run: |
          antwort=$(curl -sf -H "Host: ${DOMAIN}" -H "X-Forwarded-Proto: https" "http://127.0.0.1:${WEB_PORT_BASIS}/login/")
          echo "$antwort" | grep -qi "csrfmiddlewaretoken" || { echo "FEHLER: Login-Seite sieht nicht wie erwartet aus."; exit 1; }
          echo "OK: Login-Seite antwortet direkt korrekt."

      - name: Login-Seite über den Reverse Proxy pruefen (Portalverwaltung hat Caddy konfiguriert)
        run: |
          antwort=$(curl -sf -H "Host: ${DOMAIN}" "http://127.0.0.1:80/login/")
          echo "$antwort" | grep -qi "csrfmiddlewaretoken" || { echo "FEHLER: Instanz ist ueber Caddy nicht erreichbar."; exit 1; }
          echo "OK: Instanz ist ueber den Reverse Proxy erreichbar."

      - name: Paperless über den Reverse Proxy pruefen
        run: |
          antwort=$(curl -sf -H "Host: ${PAPERLESS_DOMAIN}" "http://127.0.0.1:80/accounts/login/")
          echo "$antwort" | grep -qi "csrfmiddlewaretoken" || { echo "FEHLER: Paperless ist ueber Caddy nicht erreichbar."; exit 1; }
          echo "OK: Paperless ist ueber den Reverse Proxy erreichbar."

      - name: Paperless-Token funktioniert und ist in Feuerix hinterlegt
        working-directory: portalverwaltung
        run: |
          python manage.py shell -c "
          import json, urllib.request
          from apps.mandanten.models import MandantInstanz
          from apps.mandanten import paperless
          m = MandantInstanz.objects.get(kuerzel='${{ env.KUERZEL }}')
          token = paperless.token_holen(m)
          r = urllib.request.Request('http://127.0.0.1:%d/api/documents/' % m.paperless_port,
              headers={'Authorization': 'Token ' + token, 'Host': m.paperless_domain})
          d = json.load(urllib.request.urlopen(r, timeout=20))
          assert 'count' in d, d
          print('OK: Paperless-API antwortet mit dem Token.')
          "
          docker compose -p "mandant-${KUERZEL}"             --env-file "${INSTANZEN_VERZEICHNIS}/${KUERZEL}/.env"             -f "${FEUERIX_REPO_PFAD}/docker-compose.yml"             -f "${INSTANZEN_VERZEICHNIS}/${KUERZEL}/compose.mandant.yml"             exec -T web python manage.py shell -c "
          from apps.paperless.models import PaperlessVerbindung
          v = PaperlessVerbindung.objects.get()
          assert v.aktiv and v.url == 'http://${PAPERLESS_DOMAIN}' and v.api_token, (v.aktiv, v.url)
          print('OK: PaperlessVerbindung in Feuerix eingetragen:', v.url)
          "

      - name: DEBUG=0 der bereitgestellten Instanz pruefen
        run: |
          antwort=$(curl -s -H "Host: ${DOMAIN}" "http://127.0.0.1:80/pfad-der-nicht-existiert-xyz/")
          if echo "$antwort" | grep -qi "You're seeing this error because you have"; then
            echo "FEHLER: Die bereitgestellte Instanz laeuft mit DEBUG=True!"
            exit 1
          fi
          echo "OK: DEBUG ist korrekt aus (siehe auch das Sicherheits-Audit von Feuerix selbst)."

      - name: Erneute Bereitstellung ist idempotent (Geheimnisse bleiben, Instanz bleibt erreichbar)
        working-directory: portalverwaltung
        run: |
          vorher=$(sha256sum "${INSTANZEN_VERZEICHNIS}/${KUERZEL}/.env" | cut -d' ' -f1)
          python manage.py mandant_bereitstellen "${KUERZEL}"
          nachher=$(sha256sum "${INSTANZEN_VERZEICHNIS}/${KUERZEL}/.env" | cut -d' ' -f1)
          [ "$vorher" = "$nachher" ] || { echo "FEHLER: .env hat sich beim erneuten Bereitstellen geaendert (Geheimnisse neu erzeugt?)"; exit 1; }
          curl -sf -H "Host: ${DOMAIN}" "http://127.0.0.1:80/login/" | grep -qi "csrfmiddlewaretoken"
          echo "OK: idempotent."

      - name: Instanz abbauen (inkl. Daten) und Aufraeumen pruefen
        working-directory: portalverwaltung
        run: |
          python manage.py mandant_abbauen "${KUERZEL}" --daten-loeschen
          [ -z "$(docker ps -aq --filter label=com.docker.compose.project=mandant-${KUERZEL})" ] || { echo "FEHLER: Container uebrig"; exit 1; }
          [ -z "$(docker ps -aq --filter label=com.docker.compose.project=mandant-${KUERZEL}-paperless)" ] || { echo "FEHLER: Paperless-Container uebrig"; exit 1; }
          [ -z "$(docker volume ls -q --filter label=com.docker.compose.project=mandant-${KUERZEL}-paperless)" ] || { echo "FEHLER: Paperless-Volumes uebrig"; exit 1; }
          [ -z "$(docker volume ls -q --filter label=com.docker.compose.project=mandant-${KUERZEL})" ] || { echo "FEHLER: Volumes uebrig"; exit 1; }
          if curl -s -H "Host: ${DOMAIN}" "http://127.0.0.1:80/login/" | grep -qi "csrfmiddlewaretoken"; then
            echo "FEHLER: Instanz ist nach dem Abbau noch ueber den Proxy erreichbar."; exit 1
          fi
          echo "OK: Container, Volumes und Proxy-Eintrag sind weg."

      - name: Container-Logs bei Fehlschlag ausgeben
        if: failure()
        run: |
          docker compose -p "mandant-${{ env.KUERZEL }}" \
            --env-file "${{ env.INSTANZEN_VERZEICHNIS }}/${{ env.KUERZEL }}/.env" \
            -f "${{ env.FEUERIX_REPO_PFAD }}/docker-compose.yml" \
            -f "${{ env.INSTANZEN_VERZEICHNIS }}/${{ env.KUERZEL }}/compose.mandant.yml" logs --tail=200 || true
          echo "--- caddy ---"; docker logs caddy --tail=100 || true
          echo "--- paperless ---"
          docker ps -a --filter label=com.docker.compose.project=mandant-${KUERZEL}-paperless || true
          docker logs $(docker ps -aq --filter label=com.docker.compose.project=mandant-${KUERZEL}-paperless --filter label=com.docker.compose.service=webserver) --tail=120 || true

      - name: Aufraeumen (immer)
        if: always()
        run: |
          docker compose -p "mandant-${{ env.KUERZEL }}" \
            --env-file "${{ env.INSTANZEN_VERZEICHNIS }}/${{ env.KUERZEL }}/.env" \
            -f "${{ env.FEUERIX_REPO_PFAD }}/docker-compose.yml" \
            -f "${{ env.INSTANZEN_VERZEICHNIS }}/${{ env.KUERZEL }}/compose.mandant.yml" down -v || true
          docker rm -f caddy || true

  openslides:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DJANGO_SETTINGS_MODULE: config.settings_sqlite
      FEUERIX_REPO_PFAD: ${{ github.workspace }}/feuerix
      INSTANZEN_VERZEICHNIS: ${{ github.workspace }}/instanzen
      WEB_PORT_BASIS: "8100"
      OPENSLIDES_PORT_BASIS: "9100"
      KUERZEL: ci-os
      DOMAIN: ci-os.example.test
      OPENSLIDES_DOMAIN: ci-os-versammlung.example.test
      CADDY_ADMIN_URL: http://127.0.0.1:2019
      PROXY_NUR_HTTP: "1"

    steps:
      - name: Portalverwaltung auschecken
        uses: actions/checkout@v4
        with:
          path: portalverwaltung

      - name: Feuerix auschecken
        uses: actions/checkout@v4
        with:
          repository: ricten/Feuerix
          ref: main
          path: feuerix

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren und Datenbank einrichten
        working-directory: portalverwaltung
        run: |
          pip install -r requirements.txt
          python manage.py migrate

      - name: Test-Mandant mit OpenSlides anlegen
        working-directory: portalverwaltung
        run: |
          python manage.py shell -c "
          from apps.mandanten.models import MandantInstanz
          MandantInstanz.objects.get_or_create(kuerzel='${{ env.KUERZEL }}', defaults={
              'verein_name': 'CI-OS e.V.', 'domain': '${{ env.DOMAIN }}',
              'openslides_domain': '${{ env.OPENSLIDES_DOMAIN }}', 'admin_email': 'ci@example.org'})
          "

      - name: Caddy (Reverse Proxy) starten
        run: |
          docker run -d --name caddy --network host caddy:2
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:2019/config/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:2019/config/ >/dev/null || { echo "FEHLER: Caddy-Admin-API nicht erreichbar"; exit 1; }

      - name: Instanz mit OpenSlides bereitstellen
        working-directory: portalverwaltung
        run: python manage.py mandant_bereitstellen "${{ env.KUERZEL }}"

      - name: OpenSlides über den Reverse Proxy pruefen
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: ${OPENSLIDES_DOMAIN}" "http://127.0.0.1:80/")
          [ "$code" = "200" ] || { echo "FEHLER: OpenSlides antwortet ueber Caddy mit HTTP $code"; exit 1; }
          echo "OK: OpenSlides ist ueber den Reverse Proxy erreichbar."

      - name: Anbindung in Feuerix hinterlegt und Superadmin-Passwort gespeichert
        working-directory: portalverwaltung
        run: |
          python manage.py shell -c "
          from apps.mandanten.models import MandantInstanz
          m = MandantInstanz.objects.get(kuerzel='${{ env.KUERZEL }}')
          assert m.openslides_initialisiert and m.openslides_superadmin_passwort
          print('OK: Startdaten angelegt, Passwort gespeichert.')
          "
          docker compose -p "mandant-${KUERZEL}" \
            --env-file "${INSTANZEN_VERZEICHNIS}/${KUERZEL}/.env" \
            -f "${FEUERIX_REPO_PFAD}/docker-compose.yml" \
            -f "${INSTANZEN_VERZEICHNIS}/${KUERZEL}/compose.mandant.yml" \
            exec -T web python manage.py shell -c "
          from apps.openslides.models import OpenSlidesVerbindung
          v = OpenSlidesVerbindung.objects.get()
          assert v.aktiv and v.url == 'http://${OPENSLIDES_DOMAIN}' and v.passwort and v.benutzername == 'superadmin'
          print('OK: OpenSlidesVerbindung in Feuerix eingetragen:', v.url)
          "

      - name: Erneute Bereitstellung ist idempotent
        working-directory: portalverwaltung
        run: |
          vorher=$(sha256sum "${INSTANZEN_VERZEICHNIS}/${KUERZEL}/openslides/secrets/superadmin" | cut -d' ' -f1)
          python manage.py mandant_bereitstellen "${KUERZEL}"
          nachher=$(sha256sum "${INSTANZEN_VERZEICHNIS}/${KUERZEL}/openslides/secrets/superadmin" | cut -d' ' -f1)
          [ "$vorher" = "$nachher" ] || { echo "FEHLER: Superadmin-Passwort hat sich geaendert"; exit 1; }
          echo "OK: idempotent."

      - name: Abbauen (inkl. Daten) und Aufraeumen pruefen
        working-directory: portalverwaltung
        run: |
          python manage.py mandant_abbauen "${KUERZEL}" --daten-loeschen
          for p in "mandant-${KUERZEL}" "mandant-${KUERZEL}-openslides"; do
            [ -z "$(docker ps -aq --filter label=com.docker.compose.project=$p)" ] || { echo "FEHLER: Container uebrig ($p)"; exit 1; }
            [ -z "$(docker volume ls -q --filter label=com.docker.compose.project=$p)" ] || { echo "FEHLER: Volumes uebrig ($p)"; exit 1; }
          done
          echo "OK: alles abgebaut."

      - name: Logs bei Fehlschlag ausgeben
        if: failure()
        run: |
          (cd "${INSTANZEN_VERZEICHNIS}/${KUERZEL}/openslides" && COMPOSE_PROJECT_NAME="mandant-${KUERZEL}-openslides" docker compose ps -a && COMPOSE_PROJECT_NAME="mandant-${KUERZEL}-openslides" docker compose logs --tail=60) || true
          echo "--- caddy ---"; docker logs caddy --tail=60 || true

      - name: Aufraeumen (immer)
        if: always()
        run: docker rm -f caddy || true
