name: Integrationstest (echte Bereitstellung)

# Stellt eine echte Feuerix-Instanz ueber die Portalverwaltung bereit (kein Mock) - im Unterschied zu den
# 14 Unit-Tests in apps/mandanten/tests.py, die docker/HTTP mocken. Braucht dafuer echtes Docker, das auf
# GitHub-gehosteten Ubuntu-Runnern bereits vorinstalliert ist. Keine Secrets noetig: sowohl die Geheimnisse
# der Portalverwaltung selbst (settings_sqlite.py) als auch die der bereitgestellten Test-Instanz
# (SECRET_KEY/FIELD_ENCRYPTION_KEY/Passwoerter, siehe provisioning.py::env_erzeugen) werden automatisch
# erzeugt.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  bereitstellung:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings_sqlite
      FEUERIX_REPO_PFAD: ${{ github.workspace }}/feuerix
      INSTANZEN_VERZEICHNIS: ${{ github.workspace }}/instanzen
      WEB_PORT_BASIS: "8100"
      KUERZEL: ci-test

    steps:
      - name: Portalverwaltung auschecken
        uses: actions/checkout@v4
        with:
          path: portalverwaltung

      - name: Feuerix auschecken
        uses: actions/checkout@v4
        with:
          repository: ricten/Feuerix
          ref: main
          path: feuerix

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        working-directory: portalverwaltung
        run: pip install -r requirements.txt

      - name: Portalverwaltungs-Datenbank einrichten
        working-directory: portalverwaltung
        run: python manage.py migrate

      - name: Test-Mandant anlegen
        working-directory: portalverwaltung
        run: |
          python manage.py shell -c "
          from apps.mandanten.models import MandantInstanz
          MandantInstanz.objects.get_or_create(kuerzel='${{ env.KUERZEL }}', defaults={
              'verein_name': 'CI-Test e.V.', 'domain': 'localhost', 'admin_email': 'ci@example.org'})
          "

      - name: Instanz bereitstellen (echtes docker compose up)
        working-directory: portalverwaltung
        run: python manage.py mandant_bereitstellen "${{ env.KUERZEL }}"

      - name: Login-Seite inhaltlich pruefen
        run: |
          antwort=$(curl -sf "http://127.0.0.1:${WEB_PORT_BASIS}/login/")
          echo "$antwort" | grep -qi "csrfmiddlewaretoken" || { echo "FEHLER: Login-Seite sieht nicht wie erwartet aus."; exit 1; }
          echo "OK: Login-Seite antwortet korrekt."

      - name: DEBUG=0 der bereitgestellten Instanz pruefen
        run: |
          antwort=$(curl -s "http://127.0.0.1:${WEB_PORT_BASIS}/pfad-der-nicht-existiert-xyz/")
          if echo "$antwort" | grep -qi "You're seeing this error because you have"; then
            echo "FEHLER: Die bereitgestellte Instanz laeuft mit DEBUG=True!"
            exit 1
          fi
          echo "OK: DEBUG ist korrekt aus (siehe auch das Sicherheits-Audit von Feuerix selbst)."

      - name: Container-Logs bei Fehlschlag ausgeben
        if: failure()
        run: |
          docker compose -p "mandant-${{ env.KUERZEL }}" \
            --env-file "${{ env.INSTANZEN_VERZEICHNIS }}/${{ env.KUERZEL }}/.env" \
            -f "${{ env.FEUERIX_REPO_PFAD }}/docker-compose.yml" \
            -f "${{ env.INSTANZEN_VERZEICHNIS }}/${{ env.KUERZEL }}/compose.mandant.yml" logs --tail=200

      - name: Instanz wieder abbauen
        if: always()
        run: |
          docker compose -p "mandant-${{ env.KUERZEL }}" \
            --env-file "${{ env.INSTANZEN_VERZEICHNIS }}/${{ env.KUERZEL }}/.env" \
            -f "${{ env.FEUERIX_REPO_PFAD }}/docker-compose.yml" \
            -f "${{ env.INSTANZEN_VERZEICHNIS }}/${{ env.KUERZEL }}/compose.mandant.yml" down -v || true
