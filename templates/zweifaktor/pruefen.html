{% extends "admin/base_site.html" %}
{% block content %}
<div id="content-main">
  <p>Gib den 6-stelligen Code deiner Authenticator-App ein, oder einen deiner Notfallcodes (jeder gilt nur einmal).</p>
  {% if fehler %}<p class="errornote">{{ fehler }}</p>{% endif %}
  <form method="post">{% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <p><input type="text" name="code" autocomplete="one-time-code" autofocus required style="font-size:20px;letter-spacing:3px;width:14em"></p>
    <p><input type="submit" value="Bestätigen" class="default"></p>
  </form>
  <p><a href="{% url 'admin:logout' %}">Abbrechen und abmelden</a></p>
</div>
{% endblock %}
